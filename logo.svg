<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" width="500" height="210">

	<!-- Background -->
	<rect width="100%" height="100%" fill="#0d1117" rx="14"/>

	<!-- === MICROCHIP AND SOUNDWAVE === -->
	<g transform="translate(250, 85)">

		<!-- AUDIO SIGNAL WAVEFORMS -->
		<!-- Analog sinusoidal wave -->
		<path d="M -210,0 Q -155,-50 -100,0 T 10,0" fill="none" stroke="#1f6feb" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
		<!-- Digital sampled wave -->
		<path d="M -210,20 H -180 V -10 H -140 V 25 H -100 V 0 H -60 V -20 H -20" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linejoin="round" opacity="0.5" stroke-dasharray="4,3"/>
		<!-- Output frequency wave -->
		<path d="M 20,0 Q 75,-60 130,0 T 240,0" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
		<path d="M 20,-10 Q 75,-40 130,-10 T 240,-10" fill="none" stroke="#3081f7" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

		<!-- DIGITAL SIGNAL PROCESSING (SAMPLING) VERTICAL VECTORS -->
		<g stroke="#21262d" stroke-width="1.5" stroke-dasharray="3,3">
			<line x1="-180" y1="-30" x2="-180" y2="30"/>
			<line x1="-140" y1="-30" x2="-140" y2="30"/>
			<line x1="-100" y1="-30" x2="-100" y2="30"/>
			<line x1="-60" y1="-30" x2="-60" y2="30"/>
			<line x1="75" y1="-45" x2="75" y2="20"/>
			<line x1="130" y1="-30" x2="130" y2="30"/>
			<line x1="185" y1="-45" x2="185" y2="20"/>
		</g>

		<!-- DSP MICROCHIP -->
		<!-- Connector pins -->
		<g stroke="#3081f7" stroke-width="2.5" stroke-linecap="round">
			<!-- Left pins -->
			<line x1="-54" y1="-30" x2="-40" y2="-30"/>
			<line x1="-54" y1="-15" x2="-40" y2="-15"/>
			<line x1="-54" y1="0" x2="-40" y2="0"/>
			<line x1="-54" y1="15" x2="-40" y2="15"/>
			<line x1="-54" y1="30" x2="-40" y2="30"/>
			<!-- Right pins -->
			<line x1="40" y1="-30" x2="54" y2="-30"/>
			<line x1="40" y1="-15" x2="54" y2="-15"/>
			<line x1="40" y1="0" x2="54" y2="0"/>
			<line x1="40" y1="15" x2="54" y2="15"/>
			<line x1="40" y1="30" x2="54" y2="30"/>
			<!-- Top pins -->
			<line x1="-30" y1="-54" x2="-30" y2="-40"/>
			<line x1="-15" y1="-54" x2="-15" y2="-40"/>
			<line x1="0" y1="-54" x2="0" y2="-40"/>
			<line x1="15" y1="-54" x2="15" y2="-40"/>
			<line x1="30" y1="-54" x2="30" y2="-40"/>
			<!-- Bottom pins -->
			<line x1="-30" y1="40" x2="-30" y2="54"/>
			<line x1="-15" y1="40" x2="-15" y2="54"/>
			<line x1="0" y1="40" x2="0" y2="54"/>
			<line x1="15" y1="40" x2="15" y2="54"/>
			<line x1="30" y1="40" x2="30" y2="54"/>
		</g>
		<!-- Main chip housing -->
		<rect x="-42" y="-42" width="84" height="84" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2.5"/>
		<!-- Internal silicon core outline -->
		<rect x="-26" y="-26" width="52" height="52" rx="3" fill="#0d1117" stroke="#3081f7" stroke-width="1.5"/>
		<!-- Central processing node -->
		<circle cx="0" cy="0" r="12" fill="#3081f7" stroke="#3081f7"/>
		<circle cx="0" cy="0" r="5" fill="#ffffff"/>

	</g>

	<!-- === TYPOGRAPHY === -->
	<text x="250" y="185" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" letter-spacing="4">
		GO-DSP-GUITAR
	</text>

</svg>
